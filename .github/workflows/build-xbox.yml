name: Build Pithos Xbox UWP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC and Windows SDK
        uses: ilammy/msvc-dev-cmd@v1

      - name: Generate Signing Certificate
        run: powershell -ExecutionPolicy Bypass -File xbox\make_cert.ps1

      - name: Build Xbox UWP Package
        run: cmd /c xbox\build.cmd

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xbox-latest
          name: Pithos Xbox UWP Build
          make_latest: true
          files: |
            build-xbox/*.msix
            build-xbox/*.appx
            build-xbox/*.cer
